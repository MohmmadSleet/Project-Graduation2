<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإشعارات | عيادتي</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ================================================= -->
<!-- ★★★  ضعي الهيدر الجاهز الخاص بك هنا  ★★★        -->
<!-- ================================================= -->
 

<main class="page-container">
<div class="page-head">
  <button class="back-btn" data-back aria-label="رجوع"><i class="bi bi-arrow-right"></i></button>
  <h1 class="page-title">الإشعارات</h1>
</div>

  <div class="d-flex flex-column gap-3">

    <div class="soft-card d-flex gap-3 p-3">
      <span class="icon-blob" style="width:48px;height:48px;font-size:1.1rem;background:#e7f1ff;color:#1e6fe8">
        <i class="bi bi-bell-fill"></i>
      </span>
      <div class="flex-grow-1">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <span class="fw-bold">تذكير بموعدك غداً</span>
          <span class="text-muted-2 small text-nowrap">منذ ساعة</span>
        </div>
        <div class="text-muted-2 small">موعدك مع د. محمد عبد الكريم غداً الساعة ١٠:٣٠ ص</div>
      </div>
    </div>
    <div class="soft-card d-flex gap-3 p-3">
      <span class="icon-blob" style="width:48px;height:48px;font-size:1.1rem;background:#e7f1ff;color:#1e6fe8">
        <i class="bi bi-clipboard2-pulse"></i>
      </span>
      <div class="flex-grow-1">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <span class="fw-bold">نتيجة تشخيصك جاهزة</span>
          <span class="text-muted-2 small text-nowrap">منذ ٣ أيام</span>
        </div>
        <div class="text-muted-2 small">تم تحليل أعراضك — اضغط لعرض النتيجة الكاملة</div>
      </div>
    </div>
    <div class="soft-card d-flex gap-3 p-3">
      <span class="icon-blob" style="width:48px;height:48px;font-size:1.1rem;background:#e5f7ee;color:#1d9d60">
        <i class="bi bi-check-lg"></i>
      </span>
      <div class="flex-grow-1">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <span class="fw-bold">تم تأكيد حجزك</span>
          <span class="text-muted-2 small text-nowrap">منذ ٣ أيام</span>
        </div>
        <div class="text-muted-2 small">تم تأكيد موعدك مع د. محمد عبد الكريم بنجاح</div>
      </div>
    </div>
    <div class="soft-card d-flex gap-3 p-3">
      <span class="icon-blob" style="width:48px;height:48px;font-size:1.1rem;background:#e7f1ff;color:#1e6fe8">
        <i class="bi bi-clipboard2-check"></i>
      </span>
      <div class="flex-grow-1">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <span class="fw-bold">تحديث في سجلك الطبي</span>
          <span class="text-muted-2 small text-nowrap">منذ أسبوع</span>
        </div>
        <div class="text-muted-2 small">أضاف الطبيب ملاحظات جديدة لزيارتك الأخيرة</div>
      </div>
    </div>
  </div>
</main>

</html>
