<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - العيادة الذكية</title>
  
  <!-- ربط ملف التنسيقات الرئيسي -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="pro-login-page">

  <div class="pro-login-container">
    
    <!-- كارت تسجيل الدخول الرئيسي -->
    <div class="pro-login-card">
      
      <!-- اللوجو والعنوان -->
      <div class="pro-card-header">
        <a href="index.html" class="pro-brand-logo">
          <span class="logo-icon">🦷</span>
          <span class="logo-text">عيادتي الذكية</span>
        </a>
        <h2>تسجيل الدخول</h2>
        <p>أدخل بياناتك للمتابعة للوحة التحكم</p>
      </div>

      <!-- النموذج -->
      <form class="pro-form" id="loginForm">
        
        <div class="pro-input-group">
          <label for="email">البريد الإلكتروني</label>
          <div class="pro-input-box">
            <span class="field-icon">✉️</span>
            <input type="email" id="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="pro-input-group">
          <div class="label-with-link">
            <label for="password">كلمة المرور</label>
            <a href="#" class="forgot-pass-link">نسيت كلمة المرور؟</a>
          </div>
          <div class="pro-input-box">
            <span class="field-icon">🔒</span>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn--primary pro-submit-btn">
          <span>دخول الحساب</span>
          <span class="btn-arrow">←</span>
        </button>

      </form>

      <!-- أسفل الكارت -->
      <div class="pro-card-footer">
        <p>ليس لديك حساب؟ <a href="register.html" class="highlight-link">إنشاء حساب جديد</a></p>
      </div>

    </div>

    <!-- زر العودة للرئيسية -->
    <a href="index.html" class="pro-back-home">
      <span>🏠</span> العودة للصفحة الرئيسية
    </a>

  </div>

<script src="js/site-data.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function (event) {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const result = DentalStore.login(email, password);
  if (!result.ok) {
    if (result.reason === 'pending') alert('حساب الطبيب ما زال بانتظار اعتماد الإدارة.');
    else if (result.reason === 'disabled') alert('هذا الحساب معطّل. تواصل مع إدارة النظام.');
    else alert('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
    return;
  }
  const user = result.user;
  if (user.role === 'admin') window.location.href = 'pro_admin/admin-dashboard.html';
  else if (user.role === 'doctor') window.location.href = 'doctor_dashboard/index.html';
  else window.location.href = 'pro_patient/index.html';
});
</script>
</body>
</html>
