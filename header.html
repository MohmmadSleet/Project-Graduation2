<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العيادة الذكية لطب الأسنان</title>
<link rel="stylesheet" href="style.css">
<style>

  /* الشريط العلوي */
  .top-bar {
    background: var(--color-primary-darker);
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.85rem;
  }
  .top-bar .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 38px;
  }
  .top-bar a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: inherit;
  }
  .top-bar a:hover { color: #fff; }
  .top-bar svg { width: 14px; height: 14px; }

  .top-bar-left { display: flex; align-items: center; gap: 16px; }
  .lang-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.8);
    color: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 5px;
    cursor: pointer;
  }
  .lang-btn:hover { border-color: #fff; color: #fff; }

  /* الهيدر والقائمة */
  .site-header { position: sticky; top: 0; z-index: 50; }
  .navbar {
    background: #fff;
    border-bottom: 1px solid var(--color-border);
    position: relative;
  }
  .nav-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--header-height);
    gap: 32px;
  }

  /* اللوجو */
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-icon svg { width: 24px; height: 24px; color: #fff; }
  .logo-text { display: flex; flex-direction: column; line-height: 1.25; }
  .logo-text strong { font-size: 1.05rem; font-weight: 800; color: var(--color-primary-darker); }
  .logo-text small { font-size: 0.78rem; color: var(--color-text-muted); font-weight: 500; }

  /* روابط التنقل */
  .nav-links { flex: 1; }
  .nav-links ul { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .nav-links a {
    display: block;
    padding: 10px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--color-text);
    border-radius: 8px;
  }
  .nav-links a:hover { color: var(--color-primary); background: var(--color-primary-light); }
  .nav-links a.active {
    color: var(--color-primary);
    position: relative;
  }
  .nav-links a.active::after {
    content: "";
    position: absolute;
    right: 16px;
    left: 16px;
    bottom: 3px;
    height: 2px;
    background: var(--color-primary);
    border-radius: 2px;
  }

  .nav-btns { display: flex; align-items: center; gap: 10px; }

  /* زر الموبايل */
  .menu-toggle {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 38px;
    height: 38px;
    background: transparent;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    align-items: center;
    cursor: pointer;
  }
  .menu-toggle span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--color-primary-darker);
    border-radius: 2px;
    transition: 0.2s;
  }
  .navbar.active .menu-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .navbar.active .menu-toggle span:nth-child(2) { opacity: 0; }
  .navbar.active .menu-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* Responsive */
  @media (max-width: 820px) {
    .nav-links {
      position: absolute;
      right: 0;
      left: 0;
      top: 100%;
      background: #fff;
      border-bottom: 1px solid var(--color-border);
      box-shadow: 0 12px 24px rgba(6,58,115,.08);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .navbar.active .nav-links { max-height: 360px; }
    .nav-links ul { flex-direction: column; align-items: stretch; padding: 8px; gap: 2px; }
    .nav-links a.active::after { display: none; }
    .nav-links a.active { background: var(--color-primary-light); }

    .nav-btns .btn--ghost { display: none; }
    .menu-toggle { display: flex; }
  }

  @media (max-width: 480px) {
    .nav-btns .btn--primary { padding: 9px 14px; font-size: 0.88rem; }
    .logo-text small { display: none; }
  }
</style>
</head>
<body>

<header class="site-header">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-contact">
        <a href="mailto:info@smartdentalclinic.ps">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 6 12 13 2 6"/><path d="M2 6h20v12H2z"/></svg>
          info@smartdentalclinic.ps
        </a>
      </div>
      <div class="top-bar-left">
        <span>طولكرم، فلسطين</span>
        <button class="lang-btn" type="button">EN</button>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <div class="navbar" id="navbar">
    <div class="container nav-container">

      <a href="/" class="logo">
        <span class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5c-1.5-1.5-3.6-2-5.3-1.2C4.8 4.7 3.8 6.7 4 8.8c.3 3 1.7 5.6 2.3 8.6.2 1.1.6 2.6 1.9 2.6 1.5 0 1.6-1.8 1.8-2.9.2-1.3.5-3.1 1.9-3.1s1.7 1.8 1.9 3.1c.2 1.1.4 2.9 1.9 2.9 1.3 0 1.7-1.5 1.9-2.6.6-3 2-5.6 2.3-8.6.2-2.1-.8-4.1-2.7-5C15.6 3 13.5 3.5 12 5z"/>
          </svg>
        </span>
        <span class="logo-text">
          <strong>العيادة الذكية</strong>
          <small>لطب الأسنان</small>
        </span>
      </a>

      <nav class="nav-links" id="mainNav">
        <ul>
          <li><a href="/" class="active">الرئيسية</a></li>
          <li><a href="/diagnosis">التشخيص الذكي</a></li>
          <li><a href="/doctors">الأطباء</a></li>
          <li><a href="/jobs">الوظائف</a></li>
          <li><a href="/about">من نحن</a></li>
        </ul>
      </nav>

      <div class="nav-btns">
        <a href="/login" class="btn btn--ghost">تسجيل الدخول</a>
        <a href="/register" class="btn btn--primary">إنشاء حساب</a>
        <button class="menu-toggle" id="menuBtn" type="button">
          <span></span><span></span><span></span>
        </button>
      </div>

    </div>
  </div>
</header>

<script>
  // Mobile Menu Toggle
  const navbar = document.getElementById('navbar');
  const menuBtn = document.getElementById('menuBtn');

  if (menuBtn) {
    menuBtn.addEventListener('click', function() {
      navbar.classList.toggle('active');
    });
  }
</script>

</body>
</html>
