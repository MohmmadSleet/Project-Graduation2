<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختر الموعد | عيادتي</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================================================= -->
<!-- ★★★  ضعي الهيدر الجاهز الخاص بك هنا  ★★★        -->
<!-- ================================================= -->


<main class="page-container">
<div class="page-head">
  <a href="doctors-select.html"><button class="back-btn" ><i class="bi bi-arrow-right"></i></button></a>
  
  <h1 class="page-title">اختر الموعد</h1>
</div>

  <!-- progress -->
  <div class="progress mb-4" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar" style="width:70%"></div>
  </div>

  <!-- days -->
  <div class="h-scroll mb-4" data-select-group data-days>
    <div class="day-item" data-select data-day-full="الأحد ١٤ يونيو"><div class="d-name">الأحد</div><div class="d-num">١٤</div></div>
    <div class="day-item" data-select data-day-full="الاثنين ١٥ يونيو"><div class="d-name">الاثنين</div><div class="d-num">١٥</div></div>
    <div class="day-item active selected" data-select data-day-full="الثلاثاء ١٦ يونيو"><div class="d-name">الثلاثاء</div><div class="d-num">١٦</div></div>
    <div class="day-item" data-select data-day-full="الأربعاء ١٧ يونيو"><div class="d-name">الأربعاء</div><div class="d-num">١٧</div></div>
    <div class="day-item" data-select data-day-full="الخميس ١٨ يونيو"><div class="d-name">الخميس</div><div class="d-num">١٨</div></div>
  </div>

  <!-- morning -->
  <div class="d-flex align-items-center gap-2 mb-3"><i class="bi bi-sun" style="color:#cf8a0a"></i><span class="fw-bold">صباحاً</span></div>
  <div class="row g-2 mb-4" data-select-group data-slots>
      <div class="col-4"><div class="slot" data-select>09:00</div></div>
      <div class="col-4"><div class="slot disabled" data-select>09:30</div></div>
      <div class="col-4"><div class="slot" data-select>10:00</div></div>
      <div class="col-4"><div class="slot disabled active" data-select>10:30</div></div>
      <div class="col-4"><div class="slot" data-select>11:00</div></div>
      <div class="col-4"><div class="slot" data-select>11:30</div></div>
       <!-- evening -->
  <div class="d-flex align-items-center gap-2 mb-3"><i class="bi bi-moon-stars" style="color:#1e6fe8"></i><span class="fw-bold">مساءً</span></div>
  <div class="row g-2 mb-4" data-select-group data-slots>
      <div class="col-4"><div class="slot disabled" data-select>01:00</div></div>
      <div class="col-4"><div class="slot" data-select>01:30</div></div>
      <div class="col-4"><div class="slot disabled" data-select>02:00</div></div>
      <div class="col-4"><div class="slot" data-select>02:30</div></div>
      <div class="col-4"><div class="slot" data-select>03:00</div></div>
      <div class="col-4"><div class="slot" data-select>03:30</div></div>
  </div>
  </div>

 

  <!-- continue -->
  <a href="confirm-booking.html" class="btn btn-primary w-100 py-3" data-summary>متابعة - الثلاثاء ١٦ يونيو، ١٠:٣٠ ص</a>
</main>

<!-- ================================================= -->
<!-- ★★★  ضعي الفوتر الجاهز الخاص بك هنا  ★★★        -->
<!-- ================================================= -->
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
