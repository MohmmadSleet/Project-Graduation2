<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استكمال البيانات الطبية | عيادتي</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<main class="page-container py-4">
  <!-- Header -->
  <div class="page-head d-flex align-items-center gap-3 mb-4">
    <button class="btn btn-white shadow-sm rounded-circle" onclick="window.history.back()" aria-label="رجوع">
      <i class="bi bi-arrow-right fs-5"></i>
    </button>
    <div>
      <h1 class="page-title h4 mb-0 fw-bold">إكمال البيانات الطبية</h1>
      <p class="text-muted small mb-0">أهلاً بك يزن خنفر، يرجى إدخال البيانات الطبية لتقديم أفضل رعاية صحية لك</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
    <form id="medicalSetupForm">

      <!-- 1. الأمراض المزمنة -->
      <div class="card p-3 border-0 bg-white shadow-sm rounded-3 mb-4">
        <label class="form-label fw-bold text-dark mb-1">
          <i class="bi bi-heart-pulse-fill text-danger me-2"></i>هل تعاني من أي أمراض مزمنة؟
        </label>
        <p class="text-muted small mb-3">مثل: السكري، الضغط، أمراض القلب، الكلى، أو الربو.</p>
        
        <div class="d-flex gap-4 mb-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="chronicOption" id="chronicNo" value="no" checked>
            <label class="form-check-label small fw-semibold" for="chronicNo">لا يوجد</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="chronicOption" id="chronicYes" value="yes">
            <label class="form-check-label small fw-semibold" for="chronicYes">نعم، يوجد</label>
          </div>
        </div>

        <div class="d-none" id="chronicDetailsBox">
          <label class="form-label small text-muted">اكتب تفاصيل الأمراض المزمنة بالتفصيل:</label>
          <textarea class="form-control" rows="3" placeholder="مثال: مرض السكري النوع الثاني، ضغط الدم المرتفع..."></textarea>
        </div>
      </div>

      <!-- 2. أدوية السيولة والمميعات -->
      <div class="card p-3 border-0 bg-white shadow-sm rounded-3 mb-4">
        <label class="form-label fw-bold text-dark mb-2">
          <i class="bi bi-droplet-fill text-primary me-2"></i>هل تتناول أدوية لسيولة الدم (مثل الأسبرين أو الوارفارين)؟
        </label>
        <div class="d-flex gap-4">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="bloodThinner" id="bloodNo" value="no" checked>
            <label class="form-check-label small fw-semibold" for="bloodNo">لا</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="bloodThinner" id="bloodYes" value="yes">
            <label class="form-check-label small fw-semibold" for="bloodYes">نعم</label>
          </div>
        </div>
      </div>

      <!-- 3. الحساسية من الأدوية -->
      <div class="card p-3 border-0 bg-white shadow-sm rounded-3 mb-4">
        <label class="form-label fw-bold text-dark mb-1">
          <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>هل لديك حساسية تجاه أي نوع من الأدوية؟
        </label>
        <p class="text-muted small mb-2">مثل: حساسية البنسلين، أو المسكنات (مثل الإيبوبروفين).</p>
        <input type="text" class="form-control" placeholder="اكتب أنواع الحساسية إن وجدت (أو اتركها فارغة)">
      </div>

      <!-- 4. عمليات أو جراحات سابقة -->
      <div class="card p-3 border-0 bg-white shadow-sm rounded-3 mb-4">
        <label class="form-label fw-bold text-dark mb-2">
          <i class="bi bi-hospital-fill text-info me-2"></i>هل خضعت لعمليات جراحية أو زراعة أسنان سابقاً؟
        </label>
        <textarea class="form-control" rows="2" placeholder="اذكر التفاصيل إن وجدت..."></textarea>
      </div>

      <!-- 5. ملاحظات أو مخاوف خاصة -->
      <div class="card p-3 border-0 bg-white shadow-sm rounded-3 mb-4">
        <label class="form-label fw-bold text-dark mb-2">
          <i class="bi bi-chat-left-text-fill text-secondary me-2"></i>ملاحظات أو مخاوف تريد إبلاغ الطبيب بها
        </label>
        <textarea class="form-control" rows="2" placeholder="مثال: فوبيا من إبرة البنج، أو أي ملاحظة أخرى..."></textarea>
      </div>

      <!-- زر حفظ البيانات -->
      <button type="button" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm fs-6" id="saveMedicalSetup">
        حفظ البيانات الطبية والتأكيد
      </button>

    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // التحكم في إظهار وإخفاء حقل تفاصيل الأمراض المزمنة
  const chronicYes = document.getElementById('chronicYes');
  const chronicNo = document.getElementById('chronicNo');
  const chronicDetailsBox = document.getElementById('chronicDetailsBox');

  chronicYes.addEventListener('change', () => {
    if (chronicYes.checked) chronicDetailsBox.classList.remove('d-none');
  });

  chronicNo.addEventListener('change', () => {
    if (chronicNo.checked) chronicDetailsBox.classList.add('d-none');
  });

  // حفظ البيانات والعودة للرئيسية
  document.getElementById('saveMedicalSetup').addEventListener('click', () => {
    alert('تم حفظ البيانات الطبية بنجاح!');
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
