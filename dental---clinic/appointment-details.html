<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الموعد | عيادتي</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body>

<!-- ================================================= -->
<!-- ★★★  ضعي الهيدر الجاهز الخاص بك هنا  ★★★        -->
<!-- ================================================= -->
 

<main class="page-container">
<div class="page-head">
  <a href="appointments.html">  <button class="back-btn" ><i class="bi bi-arrow-right"></i></button></a>

  <h1 class="page-title">تفاصيل الموعد</h1>
</div>

  <div class="text-center mb-4"><span class="badge-soft green fs-6"><i class="bi bi-check-lg"></i> مؤكد</span></div>

  <!-- doctor + details -->
  <div class="soft-card p-3 mb-4">
    <div class="d-flex align-items-center gap-3 mb-3">
      <span class="avatar-circle">د.م</span>
      <div>
        <div class="fw-bold">د. محمد عبد الكريم</div>
        <div class="text-muted-2 small">علاج لب الأسنان · نابلس</div>
      </div>
    </div>
    <div class="divider-dashed my-3"></div>
    <div class="d-flex flex-column gap-2">
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted-2"><i class="bi bi-calendar3 ms-1" style="color:#1e6fe8"></i> التاريخ</span>
        <span class="fw-bold">الثلاثاء ١٦ يونيو ٢٠٢٦</span>
      </div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted-2"><i class="bi bi-clock ms-1" style="color:#1e6fe8"></i> الوقت</span>
        <span class="fw-bold">١٠:٣٠ صباحاً</span>
      </div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted-2"><i class="bi bi-clipboard2-pulse ms-1" style="color:#1e6fe8"></i> نوع الخدمة</span>
        <span class="fw-bold">علاج عصب - جلسة أولى</span>
      </div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted-2"><i class="bi bi-geo-alt-fill ms-1" style="color:#1e6fe8"></i> العيادة</span>
        <span class="fw-bold">عيادة الحكيم، نابلس</span>
      </div>
    </div>
  </div>

  <!-- reminder -->
  <div class="info-box mb-4 text-center">
    <i class="bi bi-bell-fill ms-1"></i>
    سيصلك تذكير تلقائي قبل ٢٤ ساعة من الموعد 
  </div>

  <!-- actions -->
  <div class="row g-2">
    <div class="col-6">
      <a href="booking.html" class="btn btn-blue-soft w-100 py-3">إعادة الجدولة</a>
    </div>
    <div class="col-6">
      <a href="cancel-appointment.html" class="btn btn-red-soft w-100 py-3">إلغاء الموعد</a>
    </div>
  </div>
</main>

<!-- ================================================= -->
<!-- ★★★  ضعي الفوتر الجاهز الخاص بك هنا  ★★★        -->
<!-- ================================================= -->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
