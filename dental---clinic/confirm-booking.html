<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تأكيد الحجز | عيادتي</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================================================= -->
<!-- ★★★  ضعي الهيدر الجاهز الخاص بك هنا  ★★★        -->
<!-- ================================================= -->
 

<main class="page-container">
<div class="page-head">
  <a href="booking.html">  <button class="back-btn" ><i class="bi bi-arrow-right"></i></button></a>

  <h1 class="page-title">تأكيد الحجز</h1>
</div>

  <!-- progress -->
  <div class="progress mb-4" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar" style="width:100%"></div>
  </div>

  <!-- doctor summary -->
  <div class="soft-card p-3 mb-4">
    <div class="d-flex align-items-center gap-3 mb-3">
      <span class="avatar-circle">د.م</span>
      <div>
        <div class="fw-bold">د. محمد عبد الكريم</div>
        <div class="text-muted-2 small">علاج لب الأسنان</div>
      </div>
    </div>
    <div class="divider-dashed my-3"></div>
    <div class="d-flex flex-column gap-2">
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted-2"><i class="bi bi-calendar3 ms-1" style="color:#1e6fe8"></i> التاريخ</span>
        <span class="fw-bold">الثلاثاء ١٦ يونيو ٢٠٢٦</span>
      </div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted-2"><i class="bi bi-clock ms-1" style="color:#1e6fe8"></i> الوقت</span>
        <span class="fw-bold">١٠:٣٠ صباحاً</span>
      </div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted-2"><i class="bi bi-geo-alt-fill ms-1" style="color:#1e6fe8"></i> الموقع</span>
        <span class="fw-bold">نابلس - عيادة الحكيم</span>
      </div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted-2"><i class="bi bi-cash-stack ms-1" style="color:#1e6fe8"></i> الرسوم</span>
        <span class="fw-bold">٨٠ شيكل <span class="text-muted-2 fw-normal small">(كشفية)</span></span>
      </div>
    </div>
  </div>

  <!-- notes -->
  <label class="form-label fw-bold">ملاحظات للطبيب (اختياري)</label>
  <textarea class="form-control mb-4" rows="3" placeholder="تشخيص أولي يشير لالتهاب لب بالخد منذ يومين"></textarea>

  <a href="booking-success.html" class="btn btn-primary w-100 py-3">تأكيد الحجز</a>
</main>

<!-- ================================================= -->
<!-- ★★★  ضعي الفوتر الجاهز الخاص بك هنا  ★★★        -->
<!-- ================================================= -->
 

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
