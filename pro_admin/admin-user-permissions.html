<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المستخدم | Smart Dental Clinic</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body><main class="page-container admin-page">
<nav class="admin-nav">
  <a href="admin-dashboard.html" class="admin-nav-item"><i class="bi bi-grid-1x2-fill"></i><span>لوحة التحكم</span></a>
  <a href="admin-users.html" class="admin-nav-item"><i class="bi bi-people-fill"></i><span>المستخدمون</span></a>
  <a href="admin-appointments.html" class="admin-nav-item"><i class="bi bi-calendar2-check-fill"></i><span>المواعيد</span></a>
  <a href="admin-doctor-approvals.html" class="admin-nav-item"><i class="bi bi-person-check-fill"></i><span>الأطباء</span></a>
  <a href="admin-reports.html" class="admin-nav-item"><i class="bi bi-bar-chart-line-fill"></i><span>التقارير</span></a>
  <a href="admin-activity.html" class="admin-nav-item"><i class="bi bi-clock-history"></i><span>النشاطات</span></a>
  <a href="admin-settings.html" class="admin-nav-item"><i class="bi bi-gear-fill"></i><span>الإعدادات</span></a>
</nav>
<div class="page-head"><a href="admin-users.html" class="back-btn"><i class="bi bi-arrow-right"></i></a><h1 class="page-title">إدارة المستخدم</h1></div>
<div id="adminUserMissing" class="soft-card p-4 d-none">المستخدم غير موجود.</div>
<div id="adminUserEditor">
  <div class="soft-card profile-summary mb-4"><span id="adminUserAvatar" class="avatar-circle avatar-lg">م</span><div><h2 id="adminUserName" class="h5 fw-bold mb-1">—</h2><div id="adminUserMeta" class="text-muted-2">—</div><div id="adminUserSince" class="small text-muted-2 mt-1">—</div></div></div>
  <div class="section-divider"><span>تعديل بيانات الحساب</span></div>
  <form id="adminUserEditForm" class="soft-card form-card admin-edit-grid">
    <div><label class="form-label">الاسم الأول</label><input id="editFirstName" class="form-control" required></div>
    <div><label class="form-label">اسم العائلة</label><input id="editLastName" class="form-control" required></div>
    <div><label class="form-label">الاسم الظاهر</label><input id="editName" class="form-control" required></div>
    <div><label class="form-label">البريد الإلكتروني</label><input id="editEmail" type="email" class="form-control" required></div>
    <div><label class="form-label">رقم الهاتف</label><input id="editPhone" class="form-control"></div>
    <div><label class="form-label">نوع الحساب</label><select id="editRole" class="form-select"><option value="patient">مريض</option><option value="doctor">طبيب</option></select></div>
    <div><label class="form-label">حالة الحساب</label><select id="editStatus" class="form-select"><option value="active">نشط</option><option value="pending">بانتظار الاعتماد</option><option value="disabled">معطل</option></select></div>
    <div><label class="form-label">كلمة المرور</label><input id="editPassword" class="form-control"></div>
    <div class="doctor-only"><label class="form-label">التخصص</label><input id="editSpecialty" class="form-control"></div>
    <div class="doctor-only"><label class="form-label">رقم الترخيص</label><input id="editLicense" class="form-control"></div>
    <div class="doctor-only admin-grid-full"><label class="form-label">موقع العيادة</label><input id="editClinic" class="form-control"></div>
    <div class="admin-grid-full d-flex gap-2 flex-wrap"><button type="submit" class="btn btn-primary px-4">حفظ كل التعديلات</button><button type="button" id="deleteUserBtn" class="btn btn-red-soft px-4">حذف الحساب نهائيًا</button></div>
  </form>
  <div class="section-divider mt-4"><span>مواعيد هذا المستخدم</span></div>
  <div id="adminUserAppointments" class="d-flex flex-column gap-3"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/site-data.js"></script><script src="js/admin.js"></script>
</body></html>
