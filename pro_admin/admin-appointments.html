<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المواعيد | Smart Dental Clinic</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body><main class="page-container admin-page">
<nav class="admin-nav">
  <a href="admin-dashboard.html" class="admin-nav-item"><i class="bi bi-grid-1x2-fill"></i><span>لوحة التحكم</span></a>
  <a href="admin-users.html" class="admin-nav-item"><i class="bi bi-people-fill"></i><span>المستخدمون</span></a>
  <a href="admin-appointments.html" class="admin-nav-item"><i class="bi bi-calendar2-check-fill"></i><span>المواعيد</span></a>
  <a href="admin-doctor-approvals.html" class="admin-nav-item"><i class="bi bi-person-check-fill"></i><span>الأطباء</span></a>
  <a href="admin-reports.html" class="admin-nav-item"><i class="bi bi-bar-chart-line-fill"></i><span>التقارير</span></a>
  <a href="admin-activity.html" class="admin-nav-item"><i class="bi bi-clock-history"></i><span>النشاطات</span></a>
  <a href="admin-settings.html" class="admin-nav-item"><i class="bi bi-gear-fill"></i><span>الإعدادات</span></a>
</nav>
<div class="page-head"><a href="admin-dashboard.html" class="back-btn"><i class="bi bi-arrow-right"></i></a><div><h1 class="page-title mb-1">إدارة جميع المواعيد</h1><div class="text-muted-2 small">تعديل الحالة والموعد والخدمة، أو حذف الموعد نهائيًا.</div></div></div>
<div class="row g-2 mb-4">
  <div class="col-lg-8"><div class="input-group admin-search"><span class="input-group-text"><i class="bi bi-search"></i></span><input id="appointmentSearch" class="form-control" placeholder="ابحث باسم المريض أو الطبيب أو الخدمة..."></div></div>
  <div class="col-lg-4"><select id="appointmentStatusFilter" class="form-select admin-filter-select"><option value="all">كل الحالات</option><option value="مؤكد">مؤكد</option><option value="انتظار">انتظار</option><option value="مكتمل">مكتمل</option><option value="ملغى">ملغى</option></select></div>
</div>
<div id="adminAppointmentsList" class="d-flex flex-column gap-3"></div>
</main>
<div class="modal fade" id="appointmentEditModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="appointmentEditForm"><div class="modal-header"><h5 class="modal-title">تعديل الموعد</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body d-grid gap-3">
<input type="hidden" id="editAppointmentId"><div><label class="form-label">المريض</label><input id="editAppointmentPatient" class="form-control" required></div><div><label class="form-label">الطبيب</label><input id="editAppointmentDoctor" class="form-control" required></div><div class="row g-2"><div class="col-6"><label class="form-label">التاريخ</label><input id="editAppointmentDate" type="date" class="form-control" required></div><div class="col-6"><label class="form-label">الوقت</label><input id="editAppointmentTime" type="time" class="form-control" required></div></div><div><label class="form-label">الخدمة</label><input id="editAppointmentService" class="form-control" required></div><div><label class="form-label">الحالة</label><select id="editAppointmentStatus" class="form-select"><option>مؤكد</option><option>انتظار</option><option>مكتمل</option><option>ملغى</option></select></div><div><label class="form-label">ملاحظات</label><textarea id="editAppointmentNotes" class="form-control" rows="3"></textarea></div>
</div><div class="modal-footer"><button type="button" class="btn btn-blue-soft" data-bs-dismiss="modal">إلغاء</button><button type="submit" class="btn btn-primary">حفظ التعديل</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/site-data.js"></script><script src="js/admin.js"></script>
</body></html>
