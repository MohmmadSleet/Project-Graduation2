
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<!-- ADMIN HEADER PLACEHOLDER -->

<main class="page-container admin-page">

<nav class="admin-nav">
  <a href="admin-dashboard.html" class="admin-nav-item"><i class="bi bi-grid-1x2-fill"></i><span>لوحة التحكم</span></a>
  <a href="admin-users.html" class="admin-nav-item"><i class="bi bi-people-fill"></i><span>المستخدمون</span></a>
  <a href="admin-doctor-approvals.html" class="admin-nav-item"><i class="bi bi-person-check-fill"></i><span>الأطباء</span></a>
  <a href="admin-reports.html" class="admin-nav-item"><i class="bi bi-bar-chart-line-fill"></i><span>التقارير</span></a>
  <a href="admin-activity.html" class="admin-nav-item"><i class="bi bi-clock-history"></i><span>النشاطات</span></a>
  <a href="admin-settings.html" class="admin-nav-item"><i class="bi bi-gear-fill"></i><span>الإعدادات</span></a>
</nav>

<div class="page-head"><a href="admin-dashboard.html" class="back-btn"><i class="bi bi-arrow-right"></i></a><h1 class="page-title">إعدادات النظام</h1></div>
<form id="settingsForm">
<div class="section-divider"><span>معلومات العيادة</span></div>
<div class="soft-card form-card mb-4">
  <label class="form-label fw-bold">اسم العيادة</label><input class="form-control mb-3" value="Smart Dental Clinic">
  <label class="form-label fw-bold">البريد الإلكتروني</label><input class="form-control mb-3" type="email" value="info@smartdental.ps">
  <label class="form-label fw-bold">رقم الهاتف</label><input class="form-control mb-3" value="059-000-0000">
  <label class="form-label fw-bold">الموقع</label><input class="form-control" value="طولكرم، فلسطين">
</div>
<div class="section-divider"><span>إعدادات المواعيد</span></div>
<div class="soft-card form-card mb-4">
  <label class="form-label fw-bold">مدة الموعد الافتراضية</label><select class="form-select mb-3"><option>30 دقيقة</option><option>45 دقيقة</option><option>60 دقيقة</option></select>
  <label class="form-label fw-bold">فترة التذكير</label><select class="form-select"><option>قبل 24 ساعة</option><option>قبل 12 ساعة</option><option>قبل ساعتين</option></select>
</div>
<div class="section-divider"><span>الإشعارات</span></div>
<div class="soft-card toggle-list mb-4">
  <label class="toggle-row"><span><b>إشعارات البريد الإلكتروني</b><small>إرسال تنبيهات الإدارة عبر البريد</small></span><input type="checkbox" checked></label>
  <label class="toggle-row"><span><b>تذكيرات المواعيد</b><small>إرسال تذكير للمريض قبل الموعد</small></span><input type="checkbox" checked></label>
</div>
<button class="btn btn-primary w-100 py-3" type="submit">حفظ التغييرات</button>
</form>

</main>

<!-- ADMIN FOOTER PLACEHOLDER -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
