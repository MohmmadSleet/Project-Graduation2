<!doctype html>

<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>الطلب قيد المراجعة | Smart Dental Clinic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-page">
      <div class="container">
        <div class="auth-card mx-auto" style="max-width: 650px">
          <div class="auth-form-wrap text-center">
            <span class="feature-icon mx-auto"
              ><i class="bi bi-hourglass-split"></i
            ></span>
            <h1 class="mt-3 mb-2">طلبك قيد المراجعة</h1>
            <p>
              تم إرسال الطلب بنجاح. يبقى حساب الطبيب في حالة انتظار، ولا تفتح
              الواجهة الطبية الكاملة حتى تتم الموافقة على إنشاء العيادة أو قبول
              طلب الوظيفة.
            </p>
            <div class="alert alert-light border rounded-4 text-start mt-4">
              <strong>الحالة:</strong> بانتظار الموافقة<br />
            </div>
            <a class="btn btn-primary mt-3" href="../../auth/login.html"
              >العودة لتسجيل الدخول</a
            >
            <a
              class="btn btn-outline-warning mt-2"
              href="clinic/application-status.html"
              >عرض مثال: طلب يحتاج استكمال</a
            ><a
              class="btn btn-outline-primary mt-2 me-2"
              href="jobs/application-status.html"
              >عرض حالة طلب وظيفة</a
            >
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/app.js"></script>
  </body>
</html>
