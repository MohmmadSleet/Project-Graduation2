<!doctype html>

<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>طلب إنشاء عيادة | Smart Dental Clinic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../../assets/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-page">
      <div class="container">
        <div class="auth-card mx-auto" style="max-width: 900px">
          <div class="auth-form-wrap">
            <a class="small text-secondary" href="../choose-path.html"
              ><i class="bi bi-arrow-right ms-1"></i>العودة لاختيار المسار</a
            >
            <h1 class="mt-4 mb-2">طلب إنشاء عيادة</h1>
            <p>واجهة أولية لإرسال بيانات العيادة للمراجعة من Super Admin.</p>
            <form
              class="mt-4"
              data-demo-submit="../approval-pending.html?type=clinic"
            >
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">اسم العيادة *</label
                  ><input
                    class="form-control"
                    placeholder="عيادة اللؤلؤة لطب الأسنان"
                    required=""
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">المدينة *</label
                  ><select class="form-select" required="">
                    <option value="">اختر المدينة</option>
                    <option>جنين</option>
                    <option>نابلس</option>
                    <option>رام الله</option>
                    <option>طولكرم</option>
                    <option>الخليل</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">رقم الهاتف *</label
                  ><input class="form-control" required="" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">البريد الرسمي</label
                  ><input class="form-control" type="email" />
                </div>
                <div class="col-12">
                  <label class="form-label">العنوان *</label
                  ><input class="form-control" required="" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">ترخيص المنشأة *</label
                  ><input class="form-control" required="" type="file" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">هوية / وثيقة المدير *</label
                  ><input class="form-control" required="" type="file" />
                </div>
                <div class="col-12">
                  <label class="form-label">ملاحظات إضافية</label
                  ><textarea class="form-control" rows="3"></textarea>
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-4 py-2">
                إرسال طلب الاعتماد
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/app.js"></script>
  </body>
</html>
