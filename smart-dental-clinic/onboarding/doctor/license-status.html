<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>حالة ترخيص الطبيب | Smart Dental Clinic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-page">
      <div class="container">
        <div class="auth-card mx-auto" style="max-width: 780px">
          <div class="auth-form-wrap">
            <div class="text-center mb-4">
              <span class="hero-badge">License Verification</span>
              <h1 class="mt-3 mb-2">حالة التحقق من الترخيص</h1>
            </div>
            <div class="alert alert-warning rounded-4">
              <strong>الحالة: تحتاج استكمال</strong>
              <div class="small mt-1">
                ملاحظة Super Admin: صورة الترخيص غير واضحة. يرجى رفع نسخة أوضح
                يظهر فيها رقم الترخيص وتاريخ الانتهاء.
              </div>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">رقم الترخيص</label
                ><input class="form-control" readonly="" value="MED-88421" />
              </div>
              <div class="col-md-6">
                <label class="form-label">الحالة</label
                ><input class="form-control" readonly="" value="needs_info" />
              </div>
              <div class="col-12">
                <label class="form-label">رفع وثيقة جديدة *</label
                ><input class="form-control" type="file" />
              </div>
              <div class="col-12">
                <label class="form-label">ملاحظة للطرف المراجع</label
                ><textarea class="form-control" rows="3">
تم رفع نسخة أوضح من الترخيص.</textarea
                >
              </div>
            </div>
            <button
              class="btn btn-primary w-100 mt-4"
              data-demo-submit="verification-pending.html"
            >
              إعادة إرسال للتحقق
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/app.js"></script>
  </body>
</html>
